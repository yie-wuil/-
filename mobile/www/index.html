<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5566f6">
<title>时光轴</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="hdr-l">
      <div class="hdr-title" id="hdrTitle">清单</div>
      <div class="hdr-sub" id="hdrSub"></div>
    </div>
    <button class="icon-btn" id="hdrAction" hidden aria-label="更多">
      <svg viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01"/></svg>
    </button>
  </header>

  <div class="banner" id="permBanner" hidden>
    <span id="permBannerText"></span>
    <button class="banner-btn" id="permBannerBtn">去开启</button>
  </div>

  <main class="screens" id="screens">

    <!-- ========== 清单（主视图：按日期分组） ========== -->
    <section class="screen active" data-screen="list">
      <div class="pad">
        <div class="seg" id="listSeg">
          <button data-range="today">今天</button>
          <button data-range="7d" class="active">最近 7 天</button>
          <button data-range="all">全部</button>
        </div>
        <div class="progress-strip" id="progStrip" hidden>
          <span id="progText"></span>
          <div class="ps-bar"><i id="progBar"></i></div>
        </div>
        <div id="listBody"></div>
        <div class="pad-bottom"></div>
      </div>
    </section>

    <!-- ========== 日历 ========== -->
    <section class="screen" data-screen="cal">
      <div class="pad">
        <div class="seg" id="calSeg">
          <button data-mode="month" class="active">月</button>
          <button data-mode="day">时间轴</button>
        </div>

        <div id="calMonthBox">
          <div class="month-bar">
            <button class="icon-btn sm" id="mPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <div class="month-label" id="mLabel"></div>
            <button class="icon-btn sm" id="mNext"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            <button class="btn sm" id="mToday">今天</button>
          </div>
          <div class="cal-head" id="calHead"></div>
          <div class="cal-grid" id="calGrid"></div>
        </div>

        <div id="calDayBox" hidden>
          <div class="day-bar">
            <button class="icon-btn sm" id="dPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <div class="month-label" id="dLabel"></div>
            <button class="icon-btn sm" id="dNext"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            <button class="btn sm" id="dToday">今天</button>
          </div>
          <div class="timeline" id="timeline"></div>
        </div>

        <div class="sec-head"><span id="dayLabel">这一天</span><span class="sec-meta" id="dayMeta"></span></div>
        <div id="dayList" class="list"></div>
        <button class="btn ghost full" id="dayAdd">+ 添加到这一天</button>
        <div class="pad-bottom"></div>
      </div>
    </section>

    <!-- ========== 目标 ========== -->
    <section class="screen" data-screen="goals">
      <div class="pad">
        <div id="goalList" class="list"></div>
        <div class="empty" id="goalEmpty" hidden>
          <p>还没有目标</p>
          <p class="muted small">目标让每天的任务有个方向</p>
        </div>
        <button class="btn primary full" id="goalAdd">+ 新建目标</button>
        <div class="pad-bottom"></div>
      </div>
    </section>

    <!-- ========== 我的 ========== -->
    <section class="screen" data-screen="me">
      <div class="pad">
        <div class="stat-cards">
          <div class="stat"><b id="meTodayDone">0</b><span>今日完成</span></div>
          <div class="stat"><b id="meWeekDone">0</b><span>本周完成</span></div>
          <div class="stat"><b id="meStreak">0</b><span>连续天数</span></div>
        </div>

        <div class="set-group">
          <div class="set-title">提醒</div>
          <div class="set-row"><span>通知权限</span><span class="set-val" id="stPerm"></span></div>
          <div class="set-row"><span>精确闹钟</span><span class="set-val" id="stExact"></span></div>
          <div class="set-row" id="rowBattery"><span>电池优化白名单</span><button class="btn sm" id="btnBattery">去设置</button></div>
          <div class="set-row"><span>任务提醒</span><label class="switch"><input type="checkbox" id="setRemind" checked><i></i></label></div>
          <div class="set-row"><span>预备提醒</span>
            <select id="setPrep" class="t-input mini">
              <option value="0">不提醒</option><option value="5">提前 5 分钟</option>
              <option value="10">提前 10 分钟</option><option value="15">提前 15 分钟</option>
            </select></div>
          <div class="set-row"><span>提醒音</span>
            <select id="setSound" class="t-input mini">
              <option value="default">默认</option><option value="chime">轻提示</option><option value="alarm">闹钟</option>
            </select></div>
          <button class="btn full" id="btnHealth">查看提醒健康检查</button>
          <button class="btn full" id="btnTestNotif">发一条测试提醒</button>
        </div>

        <div class="set-group">
          <div class="set-title">数据</div>
          <div class="set-row"><span>任务 / 目标</span><span class="set-val" id="stCount"></span></div>
          <div class="set-row"><span>上次备份</span><span class="set-val" id="stBackup"></span></div>
          <div class="set-row-2"><button class="btn" id="btnExport">导出备份</button><button class="btn" id="btnImport">导入备份</button></div>
          <button class="btn full" id="btnClearDone">清除已完成</button>
          <button class="btn danger ghost full" id="btnClear">清空全部数据</button>
        </div>

        <div class="set-group">
          <div class="set-title">显示</div>
          <div class="set-row"><span>深色模式</span><label class="switch"><input type="checkbox" id="setDark"><i></i></label></div>
          <div class="set-row"><span>默认清单范围</span>
            <select id="setRange" class="t-input mini">
              <option value="today">今天</option><option value="7d">最近 7 天</option><option value="all">全部</option>
            </select></div>
        </div>

        <p class="muted small" style="text-align:center;padding:8px 0 20px">时光轴 v0.3.0  数据只保存在本机</p>
      </div>
    </section>

  </main>

  <button class="fab" id="fab" aria-label="快速添加">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs">
    <button class="tab active" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>清单</span></button>
    <button class="tab" data-tab="cal">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>日历</span></button>
    <button class="tab" data-tab="goals">
      <svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
      <span>目标</span></button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>我的</span></button>
  </nav>
</div>

<!-- ===== 快速添加（FAB） ===== -->
<div class="sheet" id="sheetQuick" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-grab"></div>
    <div class="quick-head">快速添加</div>
    <input id="qInput" class="t-title" type="text" placeholder="明天下午3点开会 1小时 #工作" maxlength="120" autocomplete="off" enterkeyhint="done">
    <div class="parse-hint" id="qHint">支持「明天下午3点」「1小时」「#分类」，不写时间就存入未安排</div>
    <div class="quick-dates" id="qDates">
      <button class="chip-btn sm" data-qd="0">今天</button>
      <button class="chip-btn sm" data-qd="1">明天</button>
      <button class="chip-btn sm" data-qd="2">后天</button>
      <button class="chip-btn sm" data-qd="pick">选日期</button>
      <button class="chip-btn sm" data-qd="none">不安排</button>
    </div>
    <div class="t-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="qCancel">取消</button>
      <button class="btn primary" id="qAdd">添加</button>
    </div>
  </div>
</div>

<!-- ===== 任务编辑 ===== -->
<div class="sheet" id="sheetTask" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body tall">
    <div class="sheet-grab"></div>
    <input id="tTitle" class="t-title" type="text" placeholder="要做什么？" maxlength="80" autocomplete="off">
    <div class="t-row">
      <button class="chip-btn" id="tDate"></button>
      <button class="chip-btn" id="tTime"></button>
      <button class="chip-btn" id="tDur"></button>
    </div>
    <div class="t-row" id="tPriRow">
      <button class="chip-btn pri" data-pri="high">高</button>
      <button class="chip-btn pri active" data-pri="mid">中</button>
      <button class="chip-btn pri" data-pri="low">低</button>
    </div>
    <div class="t-row">
      <input id="tCat" class="t-input" type="text" placeholder="分类（可选）" maxlength="10" autocomplete="off">
      <select id="tGoal" class="t-input"></select>
    </div>
    <div class="t-row">
      <select id="tRepeat" class="t-input">
        <option value="none">不重复</option><option value="daily">每天</option>
        <option value="weekday">工作日</option><option value="weekly">每周</option><option value="monthly">每月</option>
      </select>
    </div>
    <input id="tNote" class="t-input" type="text" placeholder="备注（可选）" maxlength="200" autocomplete="off">
    <div class="t-actions">
      <button class="btn danger ghost" id="tDelete" hidden>删除</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="tCancel">取消</button>
      <button class="btn primary" id="tSave">保存</button>
    </div>
  </div>
</div>

<!-- ===== 目标编辑 ===== -->
<div class="sheet" id="sheetGoal" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-grab"></div>
    <input id="gTitle" class="t-title" type="text" placeholder="目标名称，例如：读完 12 本书" maxlength="40" autocomplete="off">
    <div class="t-row">
      <input id="gTarget" class="t-input" type="number" min="1" step="1" placeholder="目标值" value="10">
      <input id="gUnit" class="t-input" type="text" placeholder="单位（本/次/小时）" maxlength="6" autocomplete="off">
    </div>
    <input id="gManual" class="t-input" type="number" min="0" step="1" placeholder="手动补充进度（可选）" value="0">
    <div class="t-actions">
      <button class="btn danger ghost" id="gDelete" hidden>删除</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="gCancel">取消</button>
      <button class="btn primary" id="gSave">保存</button>
    </div>
  </div>
</div>

<!-- ===== 目标详情 ===== -->
<div class="sheet" id="sheetGoalDetail" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body tall">
    <div class="sheet-grab"></div>
    <div class="gd-head">
      <div class="gd-title" id="gdTitle"></div>
      <div class="gd-pct" id="gdPct"></div>
    </div>
    <div class="goal-bar"><i id="gdBar" style="width:0%"></i></div>
    <div class="goal-nums"><span id="gdNums"></span><span id="gdSub"></span></div>

    <div class="gd-add">
      <div class="capture">
        <input id="gdInput" type="text" placeholder="为这个目标添加任务" maxlength="80" autocomplete="off" enterkeyhint="done">
        <button class="capture-btn" id="gdAdd" aria-label="添加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="gd-repeat" id="gdRepeat">
        <button class="chip-btn sm active" data-rep="none">仅一次</button>
        <button class="chip-btn sm" data-rep="daily">每天</button>
        <button class="chip-btn sm" data-rep="weekday">工作日</button>
        <button class="chip-btn sm" data-rep="weekly">每周</button>
      </div>
      <div class="parse-hint" id="gdHint"></div>
    </div>

    <div class="sec-head"><span>未完成</span><span class="sec-meta" id="gdTodoMeta"></span></div>
    <div id="gdTodo" class="list"></div>
    <div class="sec-head" id="gdDoneHead" hidden><span>已完成</span><span class="sec-meta" id="gdDoneMeta"></span></div>
    <div id="gdDone" class="list"></div>

    <div class="t-actions">
      <button class="btn ghost" id="gdEdit">编辑目标</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="gdClose">关闭</button>
    </div>
  </div>
</div>


<!-- ===== 清单操作菜单 ===== -->
<div class="sheet" id="sheetListMenu" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-grab"></div>
    <button class="menu-row" id="lmHide">
      <span>隐藏已完成</span><span class="menu-note" id="lmHideState"></span>
    </button>
    <button class="menu-row danger" id="lmClear">
      <span>清除已完成</span><span class="menu-note" id="lmClearCount"></span>
    </button>
    <button class="menu-row" id="lmCarry">
      <span>顺延逾期到今天</span><span class="menu-note" id="lmOverdueCount"></span>
    </button>
    <div class="t-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="lmCancel">取消</button>
    </div>
  </div>
</div>


<!-- ===== 提醒健康检查 ===== -->
<div class="sheet" id="sheetHealth" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-grab"></div>
    <h3 class="sheet-h">提醒健康检查</h3>
    <p class="page-hint" id="healthSummary"></p>
    <div id="healthRows"></div>
    <div class="t-actions">
      <button class="btn" id="healthTest">发送测试提醒</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="healthLater">暂时不用</button>
    </div>
  </div>
</div>

<input type="file" id="fileImport" accept=".json" hidden>

<div class="toast-wrap" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
